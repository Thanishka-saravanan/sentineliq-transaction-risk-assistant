<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelIQ — Transaction Risk Investigation Assistant</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #131b2e;
            --border: #24304f;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px var(--accent-glow);
        }
        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        h1 {
            font-size: 1.85rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }
        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .status-box {
            display: flex;
            align-items: center;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 0.85rem 1.25rem;
            margin-bottom: 1.5rem;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
            margin-right: 0.75rem;
        }
        .status-text {
            color: #d1fae5;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .endpoints {
            background: #0d1322;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
        }
        .endpoints h3 {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }
        .endpoints ul {
            list-style: none;
        }
        .endpoints li {
            padding: 0.35rem 0;
            font-family: monospace;
            font-size: 0.85rem;
            color: #60a5fa;
        }
        .endpoints a {
            color: inherit;
            text-decoration: none;
        }
        .endpoints a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">TRACK_ID: PS06 | BANKING</span>
        <h1>SentinelIQ</h1>
        <p>Transaction Risk Investigation Assistant for Bank Fraud Desk.</p>
        
        <div class="status-box">
            <div class="status-dot"></div>
            <div class="status-text">FastAPI Server Active &bull; Phase 1 Skeleton Initialized</div>
        </div>

        <div class="endpoints">
            <h3>Available Endpoints:</h3>
            <ul>
                <li>&bull; <a href="/api/health" target="_blank">GET /api/health</a> &mdash; Health status check</li>
            </ul>
        </div>
    </div>
</body>
</html>
